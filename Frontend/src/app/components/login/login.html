<section class="auth-page fade-in">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/logo.png" alt="TBee Estates" class="auth-logo" />
      <h2>Welcome Back</h2>
      <p>Access your elegant estate management portal</p>
    </div>

    <div *ngIf="store.authError()" class="alert alert-danger">{{ store.authError() }}</div>
    <div *ngIf="store.authSuccess()" class="alert alert-success">{{ store.authSuccess() }}</div>

    <form (submit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-icon-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" name="email" [(ngModel)]="loginData.email" placeholder="name@domain.com" required />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-icon-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" name="password" [(ngModel)]="loginData.password" placeholder="Enter password" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="!loginForm.form.valid">
        Authenticate Session
      </button>
    </form>

    <div class="auth-footer">
      <p>New to AP Properties? <a (click)="store.navigateTo('register')">Create an account</a></p>
    </div>
  </div>
</section>
